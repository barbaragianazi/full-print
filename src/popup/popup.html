<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>full-print</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1 id="title">captura em andamento...</h1>
      <div class="row">
        <p id="phase" role="status" aria-live="polite">iniciando…</p>
        <p id="percent" aria-hidden="true">0%</p>
      </div>
      <div id="bar" role="progressbar" aria-labelledby="title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="fill"></div>
      </div>

      <section id="error" hidden>
        <p id="error-message" role="alert"></p>
        <div class="actions">
          <button id="retry" type="button" class="btn primary">tentar novamente</button>
          <button id="copy-log" type="button" class="btn">copiar log</button>
        </div>
        <details>
          <summary>detalhes técnicos</summary>
          <pre id="log"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
